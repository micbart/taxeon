<!doctype html>
<html lang="pl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Taxeon 2.0 — brak wtyczki ACF PRO</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 32px;
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			background: #f5f7fa;
			color: #15202c;
		}

		.box {
			max-width: 520px;
			padding: 40px;
			background: #fff;
			border: 1px solid #e7ebf0;
			border-radius: 18px;
			box-shadow: 0 8px 30px rgba(21, 32, 44, .08);
		}

		h1 {
			margin: 0 0 12px;
			font-size: 24px;
		}

		p {
			margin: 0 0 12px;
			line-height: 1.6;
			color: #44505f;
		}

		code {
			padding: 2px 6px;
			border-radius: 5px;
			background: #f0f3f7;
			font-size: 14px;
		}
	</style>
</head>
<body>
	<div class="box">
		<h1>Motyw wymaga ACF PRO</h1>
		<p>Motyw <strong>Taxeon 2.0</strong> buduje treść na blokach Advanced Custom Fields PRO. Zainstaluj i aktywuj wtyczkę, żeby uruchomić stronę.</p>
		<p>Definicje pól są wersjonowane w katalogu <code>acf-json</code> i wczytają się automatycznie po aktywacji.</p>
	</div>
</body>
</html>
